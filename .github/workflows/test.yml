# GitHub Actions is a finite 3,000-unit monthly budget. This full battery is
# deliberately NOT triggered by pushes, PR synchronization, or branch merges.
# Only the repository owner adding the exact `actions-budget-approved` label
# starts one fail-fast run for that PR merge ref. See GITHUB_ACTIONS_BUDGET.md.
name: test-battery

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: actions-budget-${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  authorize:
    name: authorize Actions budget
    if: >-
      github.event.label.name == 'actions-budget-approved' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: validate approved branch flow
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
          if [[ "$BASE_BRANCH" == "develop" ]]; then
            case "$HEAD_BRANCH" in
              openai/windows|openai/mac|anthropic/windows|anthropic/mac) exit 0 ;;
            esac
          fi
          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" == "develop" ]]; then
            exit 0
          fi
          echo "::error::Disallowed flow: $HEAD_BRANCH -> $BASE_BRANCH"
          exit 1

  # Keep this job id and the exact Edge install/preflight/certification adjacency:
  # the Arc 1A preflight selftest binds those workflow-owned controls. The
  # display name emits the repository's required `battery` status context only
  # for the exact owner-approved event. Unauthorized labels therefore cannot
  # satisfy branch protection with a skipped `battery` check.
  v2-compendium-memory:
    name: ${{ needs.authorize.result == 'success' && 'battery' || 'budget-not-authorized' }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_BROWSER: /usr/bin/microsoft-edge-stable
      CF_COMPENDIUMMEM_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-compendiummem
      CF_SCENEMEM_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-scenemem
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            port/v2/package-lock.json

      # Cheap/static checks run first so a deterministic red stops before the
      # expensive browsers. Each dependency tree is installed only once.
      - name: environment
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          node --version
          npm --version
          which google-chrome || which chromium-browser || echo "no chrome found"
          node port/v2/tools/browserpath.mjs --print
      - run: npm ci
      - name: preflight contract selftest
        run: npm run preflight:selftest
      - name: validate (fingerprint + render + invariants)
        run: node tools/validate.js
      - name: smoke (jsdom gameplay flows)
        run: node tools/smoke.js
      - name: legacy Field Training checkpoint capture
        run: npm run trainingcheckpoint
      - name: layout (10 viewports)
        env:
          CF_BROWSER: /usr/bin/google-chrome
          CF_UILAYOUT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tools/uilayout.js --selftest
          node tools/uilayout.js
      - name: verify root layout evidence freshness
        if: always()
        env:
          CF_BROWSER: /usr/bin/google-chrome
          CF_UILAYOUT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tools/uilayout.js --verify-run="$CF_UILAYOUT_RUN_ID"
      - name: rarity sanity
        run: node tools/rarity-sanity.js
      - name: dead code scan
        run: node tools/deadcode.js
      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: v2 parity, type, art, and coverage gates
        working-directory: port/v2
        run: |
          npm test
          npm run typecheck
          npm run artunused
          npm run artaudit
          npm run overridecheck
          npm run overridecontrol
          npm run coveragegap
          node tools/speccheck.mjs

      # Compendium resource certification retains its exact Edge authority.
      - name: install exact Arc 1A Edge calibration browser
        shell: bash
        env:
          EDGE_PACKAGE_URL: https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_151.0.4129.86-1_amd64.deb
          EDGE_PACKAGE_SHA256: 26b02cb1c6465756df94b9ef34191b614f3df627ba21b7b00b641f44cc1d8343
        run: |
          set -euo pipefail
          edge_package="$RUNNER_TEMP/microsoft-edge-stable_151.0.4129.86-1_amd64.deb"
          curl --fail --location --silent --show-error "$EDGE_PACKAGE_URL" --output "$edge_package"
          printf '%s  %s\n' "$EDGE_PACKAGE_SHA256" "$edge_package" | sha256sum --check --strict
          sudo apt-get install --reinstall --yes "$edge_package"
          test "$(dpkg-query -W -f='${Version}' microsoft-edge-stable)" = "151.0.4129.86-1"
          test -x "$CF_BROWSER"
      - name: browser provenance and Compendium memory instrument selftests
        working-directory: port/v2
        run: |
          node tools/browserpath.mjs --selftest
          node tools/compendiummem-browser-preflight.mjs --selftest
          node tools/compendiummem-browser-preflight.mjs
          npm run compendiummem:selftest
      - name: one-attempt Compendium memory certification
        id: compendium
        timeout-minutes: 40
        working-directory: port/v2
        run: npm run compendiummem
      - name: verify current Compendium memory evidence
        if: >-
          always() &&
          (steps.compendium.outcome == 'success' || steps.compendium.outcome == 'failure')
        working-directory: port/v2
        run: node tools/compendiummem.mjs --verify-run="$CF_COMPENDIUMMEM_RUN_ID"

      # Arc 1C has a separate browser/product authority from Arc 1A. Install
      # its exact Edge only after the .86 Compendium report is terminal and
      # verified; neither ruler borrows the other's browser identity.
      - name: install exact Arc 1C Edge scene-memory browser
        shell: bash
        env:
          EDGE_PACKAGE_URL: https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_151.0.4129.101-1_amd64.deb
          EDGE_PACKAGE_SHA256: bd7604025424914a61c06293cb6bf269141a29d8c54cf1997110bc96d3365d60
        run: |
          set -euo pipefail
          scene_edge_package="$RUNNER_TEMP/microsoft-edge-stable_151.0.4129.101-1_amd64.deb"
          curl --fail --location --silent --show-error "$EDGE_PACKAGE_URL" --output "$scene_edge_package"
          printf '%s  %s\n' "$EDGE_PACKAGE_SHA256" "$scene_edge_package" | sha256sum --check --strict
          sudo apt-get install --yes "$scene_edge_package"
          test "$(dpkg-query -W -f='${Version}' microsoft-edge-stable)" = "151.0.4129.101-1"
          test -x "$CF_BROWSER"
      - name: scene-memory instrument and calibration controls
        working-directory: port/v2
        run: |
          node tools/browserpath.mjs --selftest
          node --check tools/scenemem.mjs
          node --check tools/scenemem-contract.mjs
          npx vitest run tests/scenemem-contract.test.ts tests/scenemem-budget.test.ts tests/scenemem-tool.test.ts
      - name: one-attempt scene-memory certification
        id: scenemem
        timeout-minutes: 10
        working-directory: port/v2
        run: node tools/scenemem.mjs --budget=budgets/scene-memory-v2.json
      - name: verify current scene-memory evidence
        if: >-
          always() &&
          (steps.scenemem.outcome == 'success' || steps.scenemem.outcome == 'failure')
        working-directory: port/v2
        run: node tools/scenemem.mjs --verify-run="$CF_SCENEMEM_RUN_ID" --budget=budgets/scene-memory-v2.json

      # Chrome gates remain one attempt each and run only after every cheaper
      # gate and the exact-Edge ruler are green.
      - name: Chrome provenance and reporter selftests
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          node tools/browserpath.mjs --selftest
          node tools/browsercdp.mjs --selftest
          npm run smoke:report:selftest
          npm run glassmatrix:selftest
          npm run persona:selftest
          npm run preview:selftest
      - name: one-attempt real-browser slice smoke
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: npm run smoke:ci
      - name: one-attempt 12-viewport Glass matrix
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: npm run glassmatrix
      - name: automated persona synthesis
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: npm run persona:report
      - name: package origin-isolated v2 development preview
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
          PREVIEW_OUTPUT: apps/game/smoke/dev-preview-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run preview:package -- --origin=https://dev-celestialfrontier.github.io --output="$PREVIEW_OUTPUT"
          npm run preview:smoke -- --root="$PREVIEW_OUTPUT"

      # Always preserve whatever the one authorized attempt produced. Missing
      # terminal carriers remain red; artifacts never turn a red into a pass.
      - name: archive root reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: root-reports
          path: tools/current.json
          if-no-files-found: ignore
          retention-days: 14
      - name: archive root layout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: root-layout-evidence
          path: tools/uilayout-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: archive Compendium memory evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-compendium-memory-evidence
          path: |
            port/v2/apps/game/smoke/compendiummem-report.json
            port/v2/apps/game/smoke/compendiummem-${{ env.CF_COMPENDIUMMEM_RUN_ID }}-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: archive scene-memory evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-scene-memory-evidence
          path: port/v2/apps/game/smoke/scenemem-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: archive battery reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: battery-reports
          path: |
            tools/current.json
            port/v2/apps/game/smoke/slice-smoke-report.json
            port/v2/apps/game/smoke/slice-smoke.log
            port/v2/apps/game/smoke/glassmatrix-report.json
            port/v2/apps/game/smoke/automated-persona-report.json
            port/v2/apps/game/smoke/automated-persona-report.md
          if-no-files-found: ignore
          retention-days: 14
      - name: archive v2 browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-browser-evidence
          path: port/v2/apps/game/smoke/slice-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: archive playable v2 development preview
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: v2-development-preview
          path: port/v2/apps/game/smoke/dev-preview-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
