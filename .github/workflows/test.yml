# CI (external review CF-RR): release-facing root checks plus the core v2
# parity/type/art/browser-smoke PR gates. Deployment has its own milestone
# battery and is deliberately not changed by this port batch.
#
# PARALLEL-JOB STRUCTURE (2026-08-14): the old single serial job spent 33
# minutes wall, with the two real-browser evidence commands owning 78% of it
# (glassmatrix ~17 min + smoke:ci ~9 min on the 2-core software-rendering
# runner; the same commands take ~1 min and ~2 min on a workstation). Every
# other gate is independent of them, so the battery now runs as six jobs:
# root-gates, v2-static, v2-smoke, v2-glass and v2-compendium-memory in parallel, then
# v2-persona-preview joining their evidence. NOTHING was weakened: every
# command from the serial battery still runs exactly once with the same
# one-attempt/no-retry semantics; the persona join and the development
# preview artifact still require ALL other jobs green (needs:), preserving
# the whole-battery-green boundary; and the branch-site publisher keys on
# this WORKFLOW's conclusion, which is success only when every job succeeds.
# Each browser-owning job pins CF_BROWSER at job scope and re-proves browser
# provenance with its own selftests (provenance is per process, never
# workflow memory). Evidence artifacts: root reports moved from the old
# combined battery-reports into root-reports; v2 smoke/glass evidence is
# uploaded per-job (retained even when that job is red) and re-joined into
# battery-reports by the final job. Compendium memory evidence stays in its
# own exact-run artifact and is also retained when its independent job is red.
name: test-battery
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  root-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26   # parity with the local validation environment
          cache: npm
          cache-dependency-path: package-lock.json
      - name: environment
        run: |
          node --version
          npm --version
          which google-chrome || which chromium-browser || echo "no chrome found"
          node port/v2/tools/browserpath.mjs --print
      - run: npm ci
      - name: preflight contract selftest
        run: npm run preflight:selftest
      - name: validate (fingerprint + render + invariants)
        run: node tools/validate.js
      - name: smoke (jsdom gameplay flows)
        run: node tools/smoke.js
      - name: legacy Field Training checkpoint capture
        run: npm run trainingcheckpoint
      - name: layout (10 viewports)
        env:
          CF_UILAYOUT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tools/uilayout.js --selftest
          node tools/uilayout.js
      - name: verify root layout evidence freshness
        if: always()
        env:
          CF_UILAYOUT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tools/uilayout.js --verify-run="$CF_UILAYOUT_RUN_ID"
      - name: rarity sanity
        run: node tools/rarity-sanity.js
      - name: dead code scan
        run: node tools/deadcode.js
      - name: archive root reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: root-reports
          path: tools/current.json
          if-no-files-found: ignore
          retention-days: 14
      - name: archive root layout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: root-layout-evidence
          path: tools/uilayout-report.json
          if-no-files-found: error
          retention-days: 14

  v2-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: port/v2/package-lock.json
      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: v2 parity and complete TypeScript surface
        working-directory: port/v2
        run: |
          npm test
          npm run typecheck
          npm run artunused
      - name: v2 art routing and coverage sentinels
        working-directory: port/v2
        run: |
          npm run artaudit
          npm run overridecheck
          npm run overridecontrol
          npm run coveragegap
          node tools/speccheck.mjs

  v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: port/v2/package-lock.json
      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: browser provenance and instrument selftests
        working-directory: port/v2
        run: |
          node tools/browserpath.mjs --selftest
          node tools/browsercdp.mjs --selftest
          npm run smoke:report:selftest
      - name: one-attempt real-browser slice smoke
        working-directory: port/v2
        run: npm run smoke:ci
      - name: archive v2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-smoke-evidence
          path: |
            port/v2/apps/game/smoke/slice-smoke-report.json
            port/v2/apps/game/smoke/slice-smoke.log
          if-no-files-found: error
          retention-days: 14
      - name: archive v2 browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-browser-evidence
          path: port/v2/apps/game/smoke/slice-*.png
          if-no-files-found: ignore
          retention-days: 14

  v2-glass:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: port/v2/package-lock.json
      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: browser provenance selftests
        working-directory: port/v2
        run: |
          node tools/browserpath.mjs --selftest
          node tools/browsercdp.mjs --selftest
      - name: glass matrix selftest and 12-viewport certifying run
        working-directory: port/v2
        run: |
          npm run glassmatrix:selftest
          npm run glassmatrix
      - name: archive v2 glass evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-glass-evidence
          path: port/v2/apps/game/smoke/glassmatrix-report.json
          if-no-files-found: error
          retention-days: 14

  v2-compendium-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Arc 1A's numeric resource ruler is calibrated against this exact Edge
    # build. This job-local authority does not change the Gate-A/root-layout
    # browser pin in tools/deps.pinned.json.
    env:
      CF_BROWSER: /usr/bin/microsoft-edge-stable
      CF_COMPENDIUMMEM_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-compendiummem
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: port/v2/package-lock.json
      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: install exact Arc 1A Edge calibration browser
        shell: bash
        env:
          EDGE_PACKAGE_URL: https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_151.0.4129.86-1_amd64.deb
          EDGE_PACKAGE_SHA256: 26b02cb1c6465756df94b9ef34191b614f3df627ba21b7b00b641f44cc1d8343
        run: |
          set -euo pipefail
          edge_package="$RUNNER_TEMP/microsoft-edge-stable_151.0.4129.86-1_amd64.deb"
          curl --fail --location --silent --show-error "$EDGE_PACKAGE_URL" --output "$edge_package"
          printf '%s  %s\n' "$EDGE_PACKAGE_SHA256" "$edge_package" | sha256sum --check --strict
          sudo apt-get install --yes "$edge_package"
          test "$(dpkg-query -W -f='${Version}' microsoft-edge-stable)" = "151.0.4129.86-1"
          test -x "$CF_BROWSER"
      - name: browser provenance and Compendium memory instrument selftests
        working-directory: port/v2
        run: |
          node tools/browserpath.mjs --selftest
          node tools/browsercdp.mjs --selftest
          npm run compendiummem:selftest
      - name: one-attempt Compendium memory certification
        working-directory: port/v2
        run: npm run compendiummem
      - name: verify current Compendium memory evidence
        if: always()
        working-directory: port/v2
        run: node tools/compendiummem.mjs --verify-run="$CF_COMPENDIUMMEM_RUN_ID"
      - name: archive Compendium memory evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-compendium-memory-evidence
          path: |
            port/v2/apps/game/smoke/compendiummem-report.json
            port/v2/apps/game/smoke/compendiummem-${{ env.CF_COMPENDIUMMEM_RUN_ID }}-*.png
          if-no-files-found: error
          retention-days: 14

  v2-persona-preview:
    needs: [root-gates, v2-static, v2-smoke, v2-glass, v2-compendium-memory]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: port/v2/package-lock.json
      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: collect same-commit smoke evidence
        uses: actions/download-artifact@v6
        with:
          name: v2-smoke-evidence
          path: port/v2/apps/game/smoke
      - name: collect same-commit glass evidence
        uses: actions/download-artifact@v6
        with:
          name: v2-glass-evidence
          path: port/v2/apps/game/smoke
      - name: collect root reports
        uses: actions/download-artifact@v6
        with:
          name: root-reports
          path: tools
      - name: automated persona synthesis (same-commit join)
        working-directory: port/v2
        run: |
          npm run persona:selftest
          npm run persona:report
      - name: package origin-isolated v2 development preview
        working-directory: port/v2
        env:
          PREVIEW_OUTPUT: apps/game/smoke/dev-preview-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run preview:selftest
          npm run preview:package -- --origin=https://dev-celestialfrontier.github.io --output="$PREVIEW_OUTPUT"
          npm run preview:smoke -- --root="$PREVIEW_OUTPUT"
      - name: archive battery reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: battery-reports
          path: |
            tools/current.json
            port/v2/apps/game/smoke/slice-smoke-report.json
            port/v2/apps/game/smoke/slice-smoke.log
            port/v2/apps/game/smoke/glassmatrix-report.json
            port/v2/apps/game/smoke/automated-persona-report.json
            port/v2/apps/game/smoke/automated-persona-report.md
          if-no-files-found: ignore
          retention-days: 14
      - name: archive playable v2 development preview
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: v2-development-preview
          path: port/v2/apps/game/smoke/dev-preview-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  battery:
    # The develop/main branch rulesets require ONE status context named
    # "battery" (the old serial job's name). This summary gate keeps that
    # required-check name stable across internal job restructures instead of
    # coupling repository settings to job names. It succeeds only when every
    # battery job succeeded and FAILS otherwise; `if: always()` means it can
    # never satisfy the ruleset by being skipped when an upstream job is red.
    needs: [root-gates, v2-static, v2-smoke, v2-glass, v2-compendium-memory, v2-persona-preview]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every battery job green
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const bad = Object.entries(needs).filter(([, job]) => job.result !== "success");
            if (bad.length) {
              console.error("battery: failing jobs -> " + bad.map(([name, job]) => name + "=" + job.result).join(", "));
              process.exit(1);
            }
            console.log("battery: all " + Object.keys(needs).length + " jobs succeeded");
          '
