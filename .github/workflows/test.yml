# GitHub Actions is a finite 3,000-unit monthly budget. This full battery is
# deliberately NOT triggered by pushes, PR synchronization, or branch merges.
# Only the repository owner adding the exact `actions-budget-approved` label
# starts one fail-fast run for that PR merge ref. See GITHUB_ACTIONS_BUDGET.md.
name: test-battery

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: actions-budget-${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  authorize:
    name: authorize Actions budget
    if: >-
      github.event.label.name == 'actions-budget-approved' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: validate approved branch flow
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
          if [[ "$BASE_BRANCH" == "develop" ]]; then
            case "$HEAD_BRANCH" in
              openai/windows|openai/mac|anthropic/windows|anthropic/mac) exit 0 ;;
            esac
          fi
          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" == "develop" ]]; then
            exit 0
          fi
          echo "::error::Disallowed flow: $HEAD_BRANCH -> $BASE_BRANCH"
          exit 1

  # Keep this job id and the exact Edge install/preflight/certification adjacency:
  # the Arc 1A preflight selftest binds those workflow-owned controls. The
  # display name emits the repository's required `battery` status context only
  # for the exact owner-approved event. Unauthorized labels therefore cannot
  # satisfy branch protection with a skipped `battery` check.
  v2-compendium-memory:
    name: ${{ needs.authorize.result == 'success' && 'battery' || 'budget-not-authorized' }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_BROWSER: /usr/bin/google-chrome
      CF_UILAYOUT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      CF_COMPENDIUMMEM_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-compendiummem
      CF_SCENEMEM_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-scenemem
      CF_V2_SLICE_SMOKE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-slice
      CF_V2_GLASSMATRIX_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-glass
      CF_V2_ARC4_RECOVERY_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-recovery
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            port/v2/package-lock.json

      # Classify the exact PR endpoints before installing dependencies. Unknown
      # branch flows, missing objects, or an empty endpoint diff fail closed.
      - name: environment
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          node --version
          npm --version
          which google-chrome || which chromium-browser || echo "no chrome found"
          node port/v2/tools/browserpath.mjs --print
      - name: classify exact PR scope
        id: scope
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$BASE_BRANCH" in
            develop|main) ;;
            *) echo "::error::Unsupported battery base: $BASE_BRANCH"; exit 1 ;;
          esac
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"

          changed_paths="$RUNNER_TEMP/cf-battery-changed-paths"
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" -- > "$changed_paths"
          node port/v2/tools/battery-scope.mjs \
            --paths-file="$changed_paths" \
            --github-output="$GITHUB_OUTPUT"

      # This policy uses only Node built-ins, so it always runs before either
      # dependency install and stops unauthorized workflow drift cheaply.
      - name: Actions budget policy selftest
        run: node tools/actions-budget-policy.js --selftest

      # The production profile always certifies the retained v1 product. A
      # develop PR pays that cost only when it actually changes a legacy input.
      - name: install legacy root workspace
        if: >-
          github.event.pull_request.base.ref == 'main' ||
          steps.scope.outputs.legacy_changed == 'true'
        run: npm ci
      - name: legacy browser-free gates
        if: >-
          github.event.pull_request.base.ref == 'main' ||
          steps.scope.outputs.legacy_changed == 'true'
        run: |
          npm run preflight:selftest
          node tools/validate.js
          node tools/smoke.js
          npm run trainingcheckpoint
          node tools/rarity-sanity.js
          node tools/deadcode.js

      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: v2 base-profile static gates
        working-directory: port/v2
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          case "$BASE_BRANCH" in
            develop) node tools/check-profile.mjs --profile=develop ;;
            main) node tools/check-profile.mjs --profile=production ;;
            *) echo "::error::Unsupported battery base: $BASE_BRANCH"; exit 1 ;;
          esac
      - name: develop changed-art mutation control
        if: >-
          github.event.pull_request.base.ref == 'develop' &&
          steps.scope.outputs.art_instrument_changed == 'true'
        working-directory: port/v2
        run: npm run overridecontrol

      # All browser-free work precedes the first real browser. This root ruler
      # remains complete whenever its retained product is in scope.
      - name: layout (10 viewports)
        id: root_layout
        if: >-
          github.event.pull_request.base.ref == 'main' ||
          steps.scope.outputs.legacy_changed == 'true'
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          node tools/uilayout.js --selftest
          node tools/uilayout.js
      - name: verify root layout evidence freshness
        if: >-
          always() &&
          (github.event.pull_request.base.ref == 'main' || steps.scope.outputs.legacy_changed == 'true') &&
          (steps.root_layout.outcome == 'success' || steps.root_layout.outcome == 'failure')
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: node tools/uilayout.js --verify-run="$CF_UILAYOUT_RUN_ID"

      # SceneMemory is the shorter Edge-family/capability ruler, so it fails
      # first without point-version pinning or retrying either certificate.
      - name: install current Arc 1C Edge scene-memory browser
        shell: bash
        env:
          EDGE_PACKAGE_URL: https://go.microsoft.com/fwlink/?linkid=2149051
        run: |
          set -euo pipefail
          scene_edge_package="$RUNNER_TEMP/microsoft-edge-stable-current_amd64.deb"
          scene_edge_root="$RUNNER_TEMP/scenemem-edge-current"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$EDGE_PACKAGE_URL" --output "$scene_edge_package"
          test "$(dpkg-deb --field "$scene_edge_package" Package)" = "microsoft-edge-stable"
          mkdir -p "$scene_edge_root"
          dpkg-deb --extract "$scene_edge_package" "$scene_edge_root"
          scene_edge_browser="$scene_edge_root/opt/microsoft/msedge/microsoft-edge"
          test -x "$scene_edge_browser"
      - name: scene-memory fixed-second heap-phase selftest
        if: >-
          github.event.pull_request.base.ref == 'main' ||
          steps.scope.outputs.browser_instrument_changed == 'true'
        env:
          CF_BROWSER: ${{ runner.temp }}/scenemem-edge-current/opt/microsoft/msedge/microsoft-edge
        working-directory: port/v2
        run: node tools/scenemem.mjs --heap-phase-selftest
      - name: one-attempt scene-memory certification
        id: scenemem
        timeout-minutes: 10
        env:
          CF_BROWSER: ${{ runner.temp }}/scenemem-edge-current/opt/microsoft/msedge/microsoft-edge
        working-directory: port/v2
        run: node tools/scenemem.mjs --budget=budgets/scene-memory-v2.json
      - name: verify current scene-memory evidence
        if: >-
          always() &&
          (steps.scenemem.outcome == 'success' || steps.scenemem.outcome == 'failure')
        env:
          CF_BROWSER: ${{ runner.temp }}/scenemem-edge-current/opt/microsoft/msedge/microsoft-edge
        working-directory: port/v2
        run: node tools/scenemem.mjs --verify-run="$CF_SCENEMEM_RUN_ID" --budget=budgets/scene-memory-v2.json

      # Changed-instrument and production mutation controls run before
      # Compendium reserves its sealed chain, leaving extract -> live preflight
      # -> certificate -> verifier physically uninterrupted in both profiles.
      - name: changed-or-production Compendium browser instrument selftests
        if: >-
          github.event.pull_request.base.ref == 'main' ||
          steps.scope.outputs.browser_instrument_changed == 'true'
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          node tools/browserpath.mjs --selftest
          node tools/compendiummem-browser-preflight.mjs --selftest

      # Compendium retains its separately sealed extract -> preflight -> live
      # certificate chain after the shorter SceneMemory ruler is terminal-green.
      - name: install exact Arc 1A Edge calibration browser
        shell: bash
        env:
          EDGE_PACKAGE_URL: https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_151.0.4129.101-1_amd64.deb
          EDGE_PACKAGE_SHA256: bd7604025424914a61c06293cb6bf269141a29d8c54cf1997110bc96d3365d60
        run: |
          set -euo pipefail
          edge_package="$RUNNER_TEMP/microsoft-edge-stable_151.0.4129.101-1_amd64.deb"
          edge_root="$RUNNER_TEMP/compendiummem-edge-151.0.4129.101"
          curl --fail --location --silent --show-error "$EDGE_PACKAGE_URL" --output "$edge_package"
          printf '%s  %s\n' "$EDGE_PACKAGE_SHA256" "$edge_package" | sha256sum --check --strict
          test "$(dpkg-deb --field "$edge_package" Package)" = "microsoft-edge-stable"
          test "$(dpkg-deb --field "$edge_package" Version)" = "151.0.4129.101-1"
          test ! -e "$edge_root"
          mkdir "$edge_root"
          dpkg-deb --extract "$edge_package" "$edge_root"
          edge_browser="$edge_root/opt/microsoft/msedge/microsoft-edge"
          test -x "$edge_browser"
      - name: Compendium live preflight and bounded selftest
        working-directory: port/v2
        env:
          CF_BROWSER: ${{ runner.temp }}/compendiummem-edge-151.0.4129.101/opt/microsoft/msedge/microsoft-edge
        run: |
          node tools/compendiummem-browser-preflight.mjs
          npm run compendiummem:selftest
      - name: one-attempt Compendium memory certification
        id: compendium
        timeout-minutes: 40
        working-directory: port/v2
        env:
          CF_BROWSER: ${{ runner.temp }}/compendiummem-edge-151.0.4129.101/opt/microsoft/msedge/microsoft-edge
        run: npm run compendiummem
      - name: verify current Compendium memory evidence
        if: >-
          always() &&
          (steps.compendium.outcome == 'success' || steps.compendium.outcome == 'failure')
        working-directory: port/v2
        env:
          CF_BROWSER: ${{ runner.temp }}/compendiummem-edge-151.0.4129.101/opt/microsoft/msedge/microsoft-edge
        run: node tools/compendiummem.mjs --verify-run="$CF_COMPENDIUMMEM_RUN_ID"

      # Chrome gates remain one attempt each and run only after every cheaper
      # gate and the exact-Edge ruler are green.
      - name: changed-or-production Chrome launcher selftest
        if: >-
          github.event.pull_request.base.ref == 'main' ||
          steps.scope.outputs.browser_instrument_changed == 'true'
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: node tools/browsercdp.mjs --selftest
      - name: production preview producer selftests
        if: github.event.pull_request.base.ref == 'main'
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: npm run preview:selftest
      - name: one-attempt real-browser slice smoke
        id: slice
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          npm run smoke:ci
          slice_run_id="$(jq -er '.run.id' apps/game/smoke/slice-smoke-report.json)"
          test "$slice_run_id" = "$CF_V2_SLICE_SMOKE_RUN_ID"
          printf 'run_id=%s\n' "$slice_run_id" >> "$GITHUB_OUTPUT"
          node tools/smokereport.mjs --verify-run="$slice_run_id"
      - name: one-attempt 12-viewport Glass matrix
        id: glass
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          slice_run_id="${{ steps.slice.outputs.run_id }}"
          node tools/glassmatrix.mjs --slice-run="$slice_run_id"
          glass_run_id="$(jq -er '.run.id' apps/game/smoke/glassmatrix-report.json)"
          test "$glass_run_id" = "$CF_V2_GLASSMATRIX_RUN_ID"
          printf 'run_id=%s\n' "$glass_run_id" >> "$GITHUB_OUTPUT"
          node tools/glassmatrix.mjs --verify-run="$glass_run_id" --slice-run="$slice_run_id"
      - name: one-attempt Slice-and-Glass-bound Recovery certification
        id: recovery
        if: github.event.pull_request.base.ref == 'main'
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
        run: |
          slice_run_id="${{ steps.slice.outputs.run_id }}"
          glass_run_id="${{ steps.glass.outputs.run_id }}"
          node tools/arc4recovery.mjs --slice-run="$slice_run_id" --glass-run="$glass_run_id"
          recovery_run_id="$(jq -er '.runId' apps/game/smoke/arc4-recovery-report.json)"
          test "$recovery_run_id" = "$CF_V2_ARC4_RECOVERY_RUN_ID"
          node tools/arc4recovery.mjs --verify-run="$recovery_run_id" --slice-run="$slice_run_id" --glass-run="$glass_run_id"
      - name: package origin-isolated v2 development preview
        if: github.event.pull_request.base.ref == 'main'
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
          PREVIEW_OUTPUT: apps/game/smoke/dev-preview-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run preview:package -- --origin=https://dev-celestialfrontier.github.io --output="$PREVIEW_OUTPUT"
          npm run preview:smoke -- --root="$PREVIEW_OUTPUT"

      # Always preserve whatever the one authorized attempt produced. Missing
      # terminal carriers remain red; artifacts never turn a red into a pass.
      - name: archive battery reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: battery-evidence
          path: |
            tools/current.json
            tools/uilayout-report.json
            tools/uilayout-${{ env.CF_UILAYOUT_RUN_ID }}.json
            port/v2/apps/game/smoke/scenemem-report.json
            port/v2/apps/game/smoke/compendiummem-report.json
            port/v2/apps/game/smoke/compendiummem-${{ env.CF_COMPENDIUMMEM_RUN_ID }}-*.png
            port/v2/apps/game/smoke/slice-smoke-report.json
            port/v2/apps/game/smoke/slice-smoke.log
            port/v2/apps/game/smoke/slice-smoke-${{ env.CF_V2_SLICE_SMOKE_RUN_ID }}.json
            port/v2/apps/game/smoke/slice-smoke-${{ env.CF_V2_SLICE_SMOKE_RUN_ID }}.log
            port/v2/apps/game/smoke/glassmatrix-report.json
            port/v2/apps/game/smoke/glassmatrix-${{ env.CF_V2_GLASSMATRIX_RUN_ID }}.json
            port/v2/apps/game/smoke/arc4-recovery-report.json
            port/v2/apps/game/smoke/arc4-recovery-${{ env.CF_V2_ARC4_RECOVERY_RUN_ID }}.json
            port/v2/apps/game/smoke/slice-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: archive playable v2 development preview
        if: success() && github.event.pull_request.base.ref == 'main'
        uses: actions/upload-artifact@v6
        with:
          name: v2-development-preview
          path: port/v2/apps/game/smoke/dev-preview-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
