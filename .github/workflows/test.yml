# CI (external review CF-RR): the same battery deploy.js enforces locally,
# run on every push/PR so an untested commit can never sneak toward a release.
name: test-battery
on:
  push:
    branches: [main]
  pull_request:

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26   # parity with the local validation environment
          cache: npm
      - name: environment
        run: |
          node --version
          npm --version
          which google-chrome || which chromium-browser || echo "no chrome found"
      - run: npm ci
      - name: validate (fingerprint + render + invariants)
        run: node tools/validate.js
      - name: smoke (jsdom gameplay flows)
        run: node tools/smoke.js
      - name: layout (9 viewports)
        run: node tools/uilayout.js
        env:
          CF_BROWSER: /usr/bin/google-chrome
      - name: rarity sanity
        run: node tools/rarity-sanity.js
      - name: dead code scan
        run: node tools/deadcode.js
      - name: archive reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: battery-reports
          path: |
            tools/current.json
            tools/uilayout-report.json
          if-no-files-found: ignore
