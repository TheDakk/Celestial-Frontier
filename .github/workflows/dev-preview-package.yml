# Builds a commit-bound development preview for an approved human playtest.
# This workflow uploads an artifact only. It has no Pages/deployment token and
# cannot alter production or a preview host repository.
name: development-preview-package

on:
  workflow_dispatch:
    inputs:
      actions_budget_authorization:
        description: Select the run token only after Nick authorizes this one hosted workflow
        required: true
        default: DO_NOT_RUN
        type: choice
        options:
          - DO_NOT_RUN
          - RUN_ONE_AUTHORIZED_WORKFLOW
      preview_origin:
        description: Separate HTTPS origin that will host the extracted artifact
        required: true
        default: https://dev-celestialfrontier.github.io
        type: string
      acknowledge_public_artifact:
        description: I understand a published preview exposes this development build to its testers
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: actions-budget-${{ github.workflow }}-${{ github.ref }}-${{ inputs.actions_budget_authorization }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  authorize:
    name: authorize Actions budget and preview source
    if: ${{ inputs.actions_budget_authorization == 'RUN_ONE_AUTHORIZED_WORKFLOW' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: validate manual authorization and source branch
        shell: bash
        env:
          ACKNOWLEDGED: ${{ inputs.acknowledge_public_artifact }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$ACKNOWLEDGED" != "true" ]]; then
            echo "::error::The public-artifact acknowledgement is required."
            exit 1
          fi
          if [[ "$SOURCE_REF_TYPE" != "branch" ]]; then
            echo "::error::Development previews must be packaged from a branch, not $SOURCE_REF_TYPE."
            exit 1
          fi
          case "$SOURCE_BRANCH" in
            develop|openai/windows|openai/mac|anthropic/windows|anthropic/mac)
              ;;
            *)
              echo "::error::Development previews may be packaged only from develop or an approved agent branch."
              exit 1
              ;;
          esac

  package:
    name: Verify and package development preview
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development-preview-package
    env:
      CF_BROWSER: /usr/bin/google-chrome
      CF_COMPENDIUMMEM_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-manual-compendiummem
      CF_V2_SLICE_SMOKE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-slice
      CF_V2_GLASSMATRIX_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-glass
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: port/v2/package-lock.json
      - name: browser provenance
        working-directory: port/v2
        run: node tools/browserpath.mjs --print
      - name: install v2 workspace
        working-directory: port/v2
        run: npm ci
      - name: tracked-input prehosted controls
        working-directory: port/v2
        run: node tools/tracked-input-preflight.mjs --selftest
      - name: deterministic, type, and art gates
        working-directory: port/v2
        run: |
          npm test
          npm run typecheck
          npm run artunused
          npm run artaudit
          npm run overridecheck
          npm run overridecontrol
          npm run coveragegap
          node tools/speccheck.mjs
          node tools/browserpath.mjs --selftest
          node tools/browsercdp.mjs --selftest
          npm run smoke:report:selftest
          npm run glassmatrix:selftest
          npm run persona:selftest
          npm run preview:selftest
      # Compendium resource certification has an Arc-local Edge authority;
      # the job-level Chrome selection remains in force for the later smoke,
      # Glass, persona, and preview browser gates.
      - name: install exact Arc 1A Edge calibration browser
        shell: bash
        env:
          EDGE_PACKAGE_URL: https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_151.0.4129.101-1_amd64.deb
          EDGE_PACKAGE_SHA256: bd7604025424914a61c06293cb6bf269141a29d8c54cf1997110bc96d3365d60
        run: |
          set -euo pipefail
          edge_package="$RUNNER_TEMP/microsoft-edge-stable_151.0.4129.101-1_amd64.deb"
          edge_root="$RUNNER_TEMP/compendiummem-edge-151.0.4129.101"
          curl --fail --location --silent --show-error "$EDGE_PACKAGE_URL" --output "$edge_package"
          printf '%s  %s\n' "$EDGE_PACKAGE_SHA256" "$edge_package" | sha256sum --check --strict
          test "$(dpkg-deb --field "$edge_package" Package)" = "microsoft-edge-stable"
          test "$(dpkg-deb --field "$edge_package" Version)" = "151.0.4129.101-1"
          test ! -e "$edge_root"
          mkdir "$edge_root"
          dpkg-deb --extract "$edge_package" "$edge_root"
          edge_browser="$edge_root/opt/microsoft/msedge/microsoft-edge"
          test -x "$edge_browser"
      - name: Compendium memory instrument selftest
        working-directory: port/v2
        env:
          CF_BROWSER: ${{ runner.temp }}/compendiummem-edge-151.0.4129.101/opt/microsoft/msedge/microsoft-edge
        run: |
          node tools/compendiummem-browser-preflight.mjs --selftest
          node tools/compendiummem-browser-preflight.mjs
          npm run compendiummem:selftest
      - name: one-attempt Compendium memory certification
        working-directory: port/v2
        env:
          CF_BROWSER: ${{ runner.temp }}/compendiummem-edge-151.0.4129.101/opt/microsoft/msedge/microsoft-edge
        run: npm run compendiummem
      - name: verify current Compendium memory evidence
        if: always()
        working-directory: port/v2
        env:
          CF_BROWSER: ${{ runner.temp }}/compendiummem-edge-151.0.4129.101/opt/microsoft/msedge/microsoft-edge
        run: node tools/compendiummem.mjs --verify-run="$CF_COMPENDIUMMEM_RUN_ID"
      - name: upload Compendium memory evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-preview-compendium-memory-evidence
          path: |
            port/v2/apps/game/smoke/compendiummem-report.json
            port/v2/apps/game/smoke/compendiummem-${{ env.CF_COMPENDIUMMEM_RUN_ID }}-*.png
          if-no-files-found: error
          retention-days: 14
      # This artifact workflow proves the exact Slice → Glass browser link
      # before persona/packaging. It is not the dedicated uninterrupted
      # 20-minute Recovery certificate and must never be described as one.
      - name: one-attempt real-browser slice smoke
        id: slice
        working-directory: port/v2
        run: |
          npm run smoke:ci
          slice_run_id="$(jq -er '.run.id' apps/game/smoke/slice-smoke-report.json)"
          test "$slice_run_id" = "$CF_V2_SLICE_SMOKE_RUN_ID"
          printf 'run_id=%s\n' "$slice_run_id" >> "$GITHUB_OUTPUT"
          node tools/smokereport.mjs --verify-run="$slice_run_id"
        env:
          CF_BROWSER: /usr/bin/google-chrome
      - name: one-attempt 12-viewport Glass matrix
        id: glass
        working-directory: port/v2
        run: |
          slice_run_id="${{ steps.slice.outputs.run_id }}"
          node tools/glassmatrix.mjs --slice-run="$slice_run_id"
          glass_run_id="$(jq -er '.run.id' apps/game/smoke/glassmatrix-report.json)"
          test "$glass_run_id" = "$CF_V2_GLASSMATRIX_RUN_ID"
          printf 'run_id=%s\n' "$glass_run_id" >> "$GITHUB_OUTPUT"
          node tools/glassmatrix.mjs --verify-run="$glass_run_id" --slice-run="$slice_run_id"
        env:
          CF_BROWSER: /usr/bin/google-chrome
      - name: automated persona synthesis
        working-directory: port/v2
        run: npm run persona:report
        env:
          CF_BROWSER: /usr/bin/google-chrome
      - name: build commit-bound preview artifact
        working-directory: port/v2
        env:
          CF_BROWSER: /usr/bin/google-chrome
          PREVIEW_ORIGIN: ${{ inputs.preview_origin }}
          PREVIEW_OUTPUT: apps/game/smoke/dev-preview-manual-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run preview:package -- --origin="$PREVIEW_ORIGIN" --output="$PREVIEW_OUTPUT" --approved-publication-candidate
          npm run preview:smoke -- --root="$PREVIEW_OUTPUT"
      - name: upload structured browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-preview-browser-evidence
          path: |
            port/v2/apps/game/smoke/slice-smoke-report.json
            port/v2/apps/game/smoke/slice-smoke.log
            port/v2/apps/game/smoke/slice-smoke-${{ env.CF_V2_SLICE_SMOKE_RUN_ID }}.json
            port/v2/apps/game/smoke/slice-smoke-${{ env.CF_V2_SLICE_SMOKE_RUN_ID }}.log
            port/v2/apps/game/smoke/glassmatrix-report.json
            port/v2/apps/game/smoke/glassmatrix-${{ env.CF_V2_GLASSMATRIX_RUN_ID }}.json
            port/v2/apps/game/smoke/automated-persona-report.json
            port/v2/apps/game/smoke/automated-persona-report.md
            port/v2/apps/game/smoke/slice-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: upload playable development preview
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: manual-development-preview
          path: port/v2/apps/game/smoke/dev-preview-manual-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
