    body:is(.font-sys,.font-mono) :is(.panel,#survey,#toast,#ctxbar,#hintpill,#searchbox,#tutcard,#importsheet,#planetside,#topbar,#primechip,#trail,#objchip,#raillft,#railrgt) * { font-family: var(--ui) !important; }
    .glass { background: #0a101e; background: rgba(10, 16, 30, var(--glass-a)); border: 1px solid #405477;

    /* ---- the survey card: a FLOATING rounded panel (the golden's language;

    #survey { position: fixed; top: calc(var(--topbar-h) + 6px); right: calc(var(--safe-right) + 12px);

    @media (max-width: 390px) {
      .capture-card-row { grid-template-columns: minmax(0,1fr); }

    }
    /* On a landed phone the card and living-world strip are both useful:
       stack them in portrait and split the safe rectangle in landscape.
       --planetside-top is measured from the real populated strip, so larger
       text and lazy portraits cannot silently place it behind the card. */
    @media (max-width: 900px) and (orientation: portrait) {
      /* Sheet bounds live in ui-sheet-style.ts and use measured caption/hint lanes. */
      /* If a genuinely short portrait cannot retain a useful 72px roster
         viewport plus 6px clearance, the noninteractive trail yields. */
      body.surface-mode.surface-trail-yield #trail { display: none !important; }
    }
    @media (max-width: 900px) and (orientation: landscape) {
      /* The short landscape safe rectangle uses side-by-side surface cards.
         The passive trail yields; the objective remains the Charters opener
         whenever no overlay is open. */
      body.surface-mode #trail { display: none; }
      body.surface-mode #survey,
      body.surface-mode #planetside {
        width: calc((100vw - var(--safe-left) - var(--safe-right) - 36px) / 2) !important;
        max-width: calc((100vw - var(--safe-left) - var(--safe-right) - 36px) / 2) !important;
      }
    }
    /* During the final Field Training beat, the lesson is the only blocking
       surface. The populated strip returns as soon as the player graduates,
       instead of being visibly present but entirely buried behind the card. */
    body.training.surface-mode #planetside { display: none !important; }
    #planetside .planetside-heading { margin: 0 0 6px; color: var(--dim);
      font-size: 10.5px; letter-spacing: 0.06em; }

      text-align: center; vertical-align: top; }

      border-radius: 10px; border: 1px solid #22304a; background: #101827; }
    #planetside .planetside-thumb[data-thumb-state="error"] { background: #171827; border-color: #55445f; }
    #planetside .planetside-species > div { max-width: 72px; overflow: hidden;
      color: #b7c8e4; font-size: 10px; text-overflow: ellipsis; }
    body.card-open #railrgt, body.card-open #ctxbar { display: none; }   /* the card owns its silhouette */
    body.training #ctxbar { display: none; }   /* captions yield to the lesson card */

    #toast { position: fixed; right: calc(var(--safe-right) + 12px);
      bottom: calc(var(--safe-bottom) + var(--dock-h) + 24px);
      width: min(360px, calc(100vw - var(--safe-left) - var(--safe-right) - 24px));
      max-width: 480px; box-sizing: border-box; z-index: 30;

      opacity: 0; transition: opacity .35s; pointer-events: none; }

    /* ---- rail panels (the one-panel law lives in panels.ts) ---- */
    .panel { position: fixed; top: calc(var(--topbar-h) + 6px); left: calc(var(--safe-left) + 8px);
      bottom: auto; max-height: calc(100dvh - var(--topbar-h) - var(--dock-h) - var(--safe-bottom) - 30px);   /* hug content, clear measured dock */
      width: min(360px, calc(100vw - var(--safe-left) - var(--safe-right) - 16px)); overflow: auto; z-index: 22;
      /* Reserve the right-side close gutter across the full scroll range.
         The 44px sticky target occupies that gutter, so panel content can
         never render or receive focus beneath it. */
      border-radius: 14px; padding: 14px 58px 14px 14px; box-sizing: border-box;
      box-shadow: 0 8px 28px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(126,160,210,.08); }

      transform: translateX(44px); }
    #guidepanel { z-index: 24; }   /* player-requested help must sit above the z23 survey card */
