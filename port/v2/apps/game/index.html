<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Celestial Frontier v2 — Phase 4 shell</title>
  <style>
    /* THE GLASS SYSTEM (UI_PRESENTATION §1): mobile-first, one measured
       topbar publishing --topbar-h, glass panels on the MUD-dark palette,
       Georgia italics for flavor, system-ui for chrome, 44px touch floors. */
    :root { --glass-a: 0.72; --topbar-h: 56px; }
    html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden;
      font: 13px/1.5 system-ui, sans-serif; color: #cfe0f4;
      -webkit-user-select: none; user-select: none; }
    .glass { background: rgba(10, 16, 30, var(--glass-a)); border: 1px solid #22304a;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    /* ---- the unified topbar (height measured → --topbar-h) ---- */
    #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      padding: calc(env(safe-area-inset-top, 0px) + 6px) 10px 6px;
      display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
      border-width: 0 0 1px 0; border-radius: 0; }
    #trail { font-weight: 600; color: #f4f8ff; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 46vw; }
    #trail .sep { color: #5a6f95; padding: 0 3px; font-weight: 400; }
    #playerchip { margin-left: auto; color: #9fb6d6; white-space: nowrap; font-size: 12px; }
    #playerchip b { color: #ffd9a0; font-weight: 600; }
    #objchip { flex-basis: 100%; font-size: 12px; color: #aee0ff; }
    #objchip:empty { display: none; }
    #objchip .prog { color: #7ec8f0; font-weight: 600; }

    /* ---- the survey card: below the topbar, never under the dock ---- */
    #survey { position: fixed; top: var(--topbar-h); right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
      width: min(340px, 86vw); overflow: auto; z-index: 15;
      color: #cfe0f4; padding: 14px; box-sizing: border-box; display: none;
      border-width: 0 0 0 1px; border-radius: 0; }

    /* ---- the caption line: the universe speaks (Georgia italic) ---- */
    #ctxbar { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
      max-width: min(560px, 92vw); text-align: center; pointer-events: none; z-index: 12;
      font: italic 12.5px Georgia, serif; color: #8fa3c4; text-shadow: 0 1px 3px #000; }
    #hintpill { position: fixed; left: 50%; transform: translateX(-50%);
      top: calc(var(--topbar-h) + 6px); z-index: 12; pointer-events: none;
      font-size: 11.5px; color: #7f96ba; padding: 3px 12px; border-radius: 999px; }

    /* ---- the dock: bottom center, every target ≥44px ---- */
    #dock { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 20;
      display: flex; gap: 6px; padding: 6px; border-radius: 16px; }
    #dock button { min-width: 52px; min-height: 44px; border: 1px solid #2a3c5e;
      border-radius: 11px; background: rgba(14, 22, 40, 0.85); color: #9fb6d6;
      font: 11px system-ui, sans-serif; cursor: pointer; padding: 4px 8px; }
    #dock button .ico { display: block; font-size: 16px; line-height: 1.3; }
    #dock button.on { background: #1d3a5e; color: #eaf2ff; border-color: #3a5c8e; }
  </style>
</head>
<body>
  <header id="topbar" class="glass">
    <span id="trail">Cosmos</span>
    <span id="playerchip"></span>
    <span id="objchip"></span>
  </header>
  <div id="hintpill" class="glass"></div>
  <div id="ctxbar"></div>
  <nav id="dock" class="glass" aria-label="dock">
    <button id="docksurvey" aria-label="survey card"><span class="ico">🔭</span>survey</button>
    <button id="dockcharts" aria-label="star charts"><span class="ico">📈</span>charts</button>
    <button id="docksound" aria-label="sound"><span class="ico">🔊</span>sound</button>
    <button id="docksave" aria-label="save import"><span class="ico">⛭</span>save</button>
  </nav>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
