<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Celestial Frontier v2.0 — Development</title>
  <style>
    /* THE GLASS SYSTEM — POSITION PARITY WITH THE GOLDEN SCREENS
       (port/baseline-v1.8.9/screens/ui-main-*.png): the top is FLOATING
       PILLS on the canvas, not a solid bar — player chip top-left with the
       HP bar under it, Prime Codex pill top-center, trail beneath it,
       objective chip left at ~26vh, caption + hint stacked bottom-center.
       ≤900px: the round-button DOCK bottom-center (the phone golden).
       >900px: Compendium rides the LEFT RAIL and the round cluster sits
       BOTTOM-RIGHT (the desktop golden; the dock lesson of ROADMAP #11 —
       above 900px these are rail surfaces, not a dock). */
    :root {
      --glass-a: 0.84; --topbar-h: 96px; --dock-h: 44px; --ctx-h: 32px; --hint-h: 24px;
      --surface-chrome-bottom: 128px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --ink: #e9edff; --dim: #b8c7df; --faint: #91a8ca; --emph: inherit;
      --ui: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden;
      font: 13px/1.5 var(--ui); color: var(--ink);
      -webkit-user-select: none; user-select: none; }
    body.tone-bright { --ink: #fff; --dim: #d8e3f2; --faint: #b5c8e2; --emph: #ffd96a; }
    body.tone-max { --ink: #fff; --dim: #f0f4ff; --faint: #d6e2f4; --emph: #ffe08a; }
    body.font-sys { --ui: system-ui, -apple-system, sans-serif; }
    body.font-mono { --ui: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body.fs-lg { font-size: 15px; }
    body.fs-xl { font-size: 17px; }
    /* Text tiers reach every player-reading surface without flattening the
       hierarchy. `1em` inside a font-size declaration resolves from the
       parent, not from the element's former computed size; a generic
       max(1em,16px) rule can therefore make an 18px heading smaller. */
    body.fs-lg :is(.panel, #survey, #toast, #ctxbar, #hintpill, #searchbox, #tutcard, #importsheet, #planetside, #topbar, #primechip, #trail, #objchip, #raillft, #railrgt) { font-size: 15px !important; }
    body.fs-lg :is(.panel, #survey, #toast, #ctxbar, #hintpill, #searchbox, #tutcard, #importsheet, #planetside, #topbar, #primechip, #trail, #objchip, #raillft, #railrgt) :where(p,li,div,span,label,button,input,textarea,small) { font-size: 14px !important; }
    body.fs-lg :is(.panel, #survey, #tutcard, #importsheet) h2 { font-size: 19px !important; }
    body.fs-lg :is(.panel, #survey, #tutcard, #importsheet) :is(h3,h5) { font-size: 16px !important; }
    body.fs-lg :is(.panel, #survey, #tutcard, #importsheet) h4 { font-size: 20px !important; }
    body.fs-xl :is(.panel, #survey, #toast, #ctxbar, #hintpill, #searchbox, #tutcard, #importsheet, #planetside, #topbar, #primechip, #trail, #objchip, #raillft, #railrgt) { font-size: 17px !important; }
    body.fs-xl :is(.panel, #survey, #toast, #ctxbar, #hintpill, #searchbox, #tutcard, #importsheet, #planetside, #topbar, #primechip, #trail, #objchip, #raillft, #railrgt) :where(p,li,div,span,label,button,input,textarea,small) { font-size: 16px !important; }
    body.fs-xl :is(.panel, #survey, #tutcard, #importsheet) h2 { font-size: 21px !important; }
    body.fs-xl :is(.panel, #survey, #tutcard, #importsheet) :is(h3,h5) { font-size: 18px !important; }
    body.fs-xl :is(.panel, #survey, #tutcard, #importsheet) h4 { font-size: 22px !important; }
    body.fs-lg #dock .ico { font-size: 18px !important; }
    body.fs-xl #dock .ico { font-size: 20px !important; }
    body.fs-lg #guidepanel .guide-icon { font-size: 20px !important; }
    body.fs-xl #guidepanel .guide-icon { font-size: 22px !important; }
    body.fs-lg #toast [data-sel="toast-title"] { font-size: 16px !important; }
    body.fs-xl #toast [data-sel="toast-title"] { font-size: 19px !important; }
    body.fs-lg #tutstephead { font-size: 14px !important; }
    body.fs-lg #tutsteptext { font-size: 15px !important; }
    body.fs-xl #tutstephead { font-size: 16px !important; }
    body.fs-xl #tutsteptext { font-size: 17px !important; }
    body.fs-lg #hpbar .track { height: 20px; }
    body.fs-lg #hpbar .txt { line-height: 20px; }
    body.fs-xl #hpbar .track { height: 22px; }
    body.fs-xl #hpbar .txt { line-height: 22px; }
    b { color: var(--emph); }
    body:is(.tone-bright,.tone-max) :is(.panel,#survey,#toast,#ctxbar,#hintpill,#tutcard,#importsheet,#planetside,#topbar,#primechip,#trail,#objchip,#raillft,#railrgt) { color: var(--ink) !important; }
    body:is(.tone-bright,.tone-max) :is(.panel,#survey,#toast,#ctxbar,#hintpill,#tutcard,#importsheet,#planetside,#topbar,#primechip,#trail,#objchip,#raillft,#railrgt) :is(.sub,label,[data-row] > span) { color: var(--dim) !important; }
    body:is(.font-sys,.font-mono) :is(.panel,#survey,#toast,#ctxbar,#hintpill,#searchbox,#tutcard,#importsheet,#planetside,#topbar,#primechip,#trail,#objchip,#raillft,#railrgt),
    body:is(.font-sys,.font-mono) :is(.panel,#survey,#toast,#ctxbar,#hintpill,#searchbox,#tutcard,#importsheet,#planetside,#topbar,#primechip,#trail,#objchip,#raillft,#railrgt) * { font-family: var(--ui) !important; }
    .glass { background: #0a101e; background: rgba(10, 16, 30, var(--glass-a)); border: 1px solid #405477;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: rgba(10, 16, 30, 0.96); }
    }
    .pill { border-radius: 999px; }
    * { scrollbar-width: thin; scrollbar-color: #2a3c5e transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-thumb { background: #2a3c5e; border-radius: 999px; }
    *::-webkit-scrollbar-track { background: transparent; }

    /* ---- top-left: the explorer chip + the HP bar (golden position) ---- */
    #topbar { position: fixed; top: 0; left: 0; z-index: 20; pointer-events: none;
      padding: calc(var(--safe-top) + 10px) 0 0 calc(var(--safe-left) + 12px); background: none; border: 0; }
    #playerchip { display: inline-block; padding: 6px 16px; font-size: 11.5px;
      letter-spacing: 0.08em; text-transform: uppercase; color: #dbe7f8; font-weight: 600; }
    #playerchip .dim { color: var(--dim); }
    #playerchip .player-rank { color: inherit; }
    #playerchip.rank-iridescent { color: #f4f7ff;
      background: linear-gradient(110deg,rgba(70,194,178,.34),rgba(176,108,255,.34),rgba(255,217,106,.34)); }
    #hpbar { display: flex; align-items: center; gap: 6px; margin-top: 8px;
      padding: 3px 8px 3px 6px; width: max-content; }
    #hpbar .track { display: block; width: 96px; height: 14px; border-radius: 999px;
      background: #16202f; overflow: hidden; border: 1px solid #22304a; position: relative; }
    #hpbar .fill { display: block; height: 100%; background: linear-gradient(180deg, #a9f0a0, #3fae52);
      border-radius: 999px; }
    #hpbar .txt { position: absolute; inset: 0; text-align: center; font-size: 9.5px;
      font-weight: 700; color: #f4fff6; background: rgba(5, 12, 8, 0.78);
      text-shadow: 0 1px 1px #000; line-height: 15px; }

    /* ---- top-center: the Prime Codex pill + the trail beneath ---- */
    #primechip { position: fixed; top: calc(var(--safe-top) + 12px);
      left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: auto;
      min-height: 44px; box-sizing: border-box; padding: 5px 16px; cursor: pointer;
      font: 600 12px var(--ui); color: #ffd9a0; border-color: #6e5a30;
      appearance: none; -webkit-appearance: none; }
    #primechip.on { color: #fff0c4; border-color: #caa24f;
      background: linear-gradient(rgba(202,162,79,.14),rgba(202,162,79,.14)), rgba(10,16,30,var(--glass-a)); }
    #trail { position: fixed; top: calc(var(--safe-top) + 50px);
      left: 50%; transform: translateX(-50%); z-index: 19; pointer-events: none;
      font-size: 10.5px; letter-spacing: 0.06em; color: var(--dim); white-space: nowrap;
      max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
      background: rgba(10, 16, 30, 0.94); border: 1px solid rgba(64,84,119,0.9);
      border-radius: 999px; padding: 2px 12px; }   /* framed, never naked text (bot #10) */
    #trail .cur { color: #c8ebff; }
    #trail .sep { color: var(--dim); padding: 0 5px; font-size: 9px; }

    /* ---- top-right: the search bar (both goldens' slot) ---- */
    #searchbox { position: fixed; top: calc(var(--safe-top) + 10px);
      right: calc(var(--safe-right) + 12px); z-index: 21; width: min(300px, 40vw); box-sizing: border-box;
      padding: 8px 16px; font: 12.5px system-ui, sans-serif; color: #cfe0f4;
      min-height: 44px; }
    #searchbox::placeholder, #guidesearch::placeholder { color: #b8c7df; opacity: 1; }

    /* On phones Prime occupies its own second chrome tier so the ten-control
       dock keeps the sealed five-by-two footprint and never grows a third row. */
    @media (max-width: 900px) {
      #primechip { top: calc(var(--safe-top) + 58px); max-width: calc(100vw - var(--safe-left) - var(--safe-right) - 24px);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #trail { top: calc(var(--safe-top) + 108px); }
      #playerchip { box-sizing: border-box; max-width: calc(58vw - var(--safe-left) - var(--safe-right) - 32px);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
      #searchbox { width: 42vw; }
      /* On a landed phone the populated Planetside strip owns the limited
         mid-screen reading band. The chapter objective returns on lift-off;
         keeping both at A++ made the objective cover the living-world row. */
      body.surface-mode #objchip { display: none; }
    }
    body:is(.card-open,.panel-open) :is(#trail,#objchip) { display: none; }
    @media (max-width: 480px) {
      #playerchip :is(.player-worlds,.player-rank) { display: none; }
    }

    /* ---- the objective chip: LEFT, ~26vh (both goldens) ---- */
    #objchip { position: fixed; left: calc(var(--safe-left) + 12px); top: 26vh; z-index: 18;
      padding: 6px 14px; font-size: 12px; color: #ffd9a0; max-width: min(340px, calc(100vw - var(--safe-left) - var(--safe-right) - 24px)); }
    #objchip:empty { display: none; }
    #objchip .prog { color: #7ec8f0; font-weight: 600; }

    /* ---- the survey card: a FLOATING rounded panel (the golden's language;
       the bot critique's #1-2: no edge-welding, nothing overlaps it) ---- */
    #survey { position: fixed; top: calc(var(--topbar-h) + 6px); right: calc(var(--safe-right) + 12px);
      max-height: calc(100dvh - var(--topbar-h) - var(--safe-bottom) - 160px); bottom: auto;
      width: min(340px, calc(100vw - var(--safe-left) - var(--safe-right) - 24px)); overflow: auto; z-index: 23;
      color: #cfe0f4; padding: 14px; box-sizing: border-box; display: none;
      border-radius: 14px; box-shadow: 0 10px 34px rgba(0,0,0,0.55); }
    .survey-head { display: grid; grid-template-columns: minmax(0,1fr) 44px; gap: 10px;
      align-items: start; margin-bottom: 10px; padding-bottom: 10px;
      border-bottom: 1px solid rgba(88,112,154,.72); }
    .survey-head h2 { margin: 0 0 2px; font-size: 17px; color: #f4f8ff; }
    .survey-head [data-sel="sub"] { color: var(--dim); }
    .survey-row { margin: 0; padding: 7px 0; border-bottom: 1px solid rgba(64,84,119,.42); }
    .survey-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .survey-row > span { color: var(--dim); }
    [data-capture-card-body] { margin: 10px 0; padding: 10px 0;
      border-top: 1px solid rgba(88,112,154,.72); border-bottom: 1px solid rgba(88,112,154,.72); }
    .capture-card-title { margin: 0 0 6px; color: #f3d58b; font-size: 12px;
      letter-spacing: .09em; text-transform: uppercase; }
    .capture-card-summary, .capture-card-budget, .capture-card-row-detail,
    .capture-card-odds, .capture-card-row-status, .capture-card-status,
    .capture-card-unavailable { margin: 4px 0; white-space: normal; line-height: 1.4; }
    .capture-card-summary { color: #dce9fa; }
    .capture-card-budget { color: #a8bfdb; font-size: 11.5px; }
    .capture-card-actions { display: grid; gap: 8px; margin-top: 10px; }
    .capture-card-row { display: grid; grid-template-columns: minmax(0,1fr) auto;
      gap: 4px 10px; align-items: center; min-width: 0; padding: 8px;
      border: 1px solid rgba(64,84,119,.72); border-radius: 10px;
      background: rgba(7,13,25,.5); }
    .capture-card-row:focus-visible { outline: 2px solid #7ec8f0; outline-offset: 2px; }
    .capture-card-row-title { grid-column: 1; margin: 0; color: #eef5ff; font-size: 12px; }
    .capture-card-row-detail, .capture-card-odds, .capture-card-row-status {
      grid-column: 1; color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
    .capture-card-odds { color: #bcd3ee; }
    .capture-card-action { grid-column: 2; grid-row: 1 / span 4; align-self: stretch;
      min-width: 88px; min-height: 44px; box-sizing: border-box; padding: 7px 12px;
      border: 1px solid #5575a4; border-radius: 10px; background: rgba(24,43,70,.9);
      color: #eef6ff; font: 700 12px var(--ui); cursor: pointer; touch-action: manipulation; }
    .capture-card-action:hover:not(:disabled) { border-color: #9acaf2; background: rgba(39,65,99,.96); }
    .capture-card-action:focus-visible { outline: 3px solid #f3d58b; outline-offset: 2px; }
    .capture-card-action:disabled { cursor: not-allowed; color: #8394ab;
      border-color: #39495f; background: rgba(18,26,39,.72); opacity: .82; }
    [data-capture-card-body][aria-busy="true"] .capture-card-row { border-color: rgba(126,200,240,.55); }
    .capture-card-status { min-height: 20px; color: #dce9fa; }
    .capture-card-status[data-kind="committed-hit"] { color: #bfe9c9; }
    .capture-card-status[data-kind="committed-miss"] { color: #f1d9a3; }
    .capture-card-status[data-convergence="read-only-reload"] { color: #f0bd92; }
    [data-combat-card-body] { margin: 10px 0; padding: 10px 0;
      border-top: 1px solid rgba(126,94,178,.72); border-bottom: 1px solid rgba(126,94,178,.72); }
    .combat-card-title { margin: 0 0 6px; color: #e5c7ff; font-size: 12px;
      letter-spacing: .09em; text-transform: uppercase; }
    .combat-card-defender, .combat-card-why, .combat-card-stakes,
    .combat-card-reward, .combat-card-policy, .combat-card-status {
      margin: 5px 0; white-space: normal; line-height: 1.42; overflow-wrap: anywhere; }
    .combat-card-defender { color: #eef5ff; }
    .combat-card-label { display: block; margin: 9px 0 4px; color: #cbd9ee; font-weight: 700; }
    [data-combat-champion] { width: 100%; min-height: 44px; box-sizing: border-box;
      padding: 8px 34px 8px 10px; border: 1px solid #647ba4; border-radius: 10px;
      background: #101c30; color: #eef6ff; font: 12px var(--ui); }
    [data-combat-champion]:focus-visible,
    [data-combat-challenge]:focus-visible { outline: 3px solid #f3d58b; outline-offset: 2px; }
    .combat-card-forecast { margin: 8px 0 2px; color: var(--combat-odds-color, #dce9fa); }
    .combat-card-why { color: #bcd3ee; }
    .combat-card-stakes { color: #f3c8b7; }
    .combat-card-reward { color: #bfe9c9; }
    .combat-card-policy { color: var(--dim); font-size: 11px; }
    [data-combat-challenge] { width: 100%; min-height: 44px; box-sizing: border-box;
      margin-top: 8px; padding: 8px 12px; border: 1px solid #956fc7; border-radius: 10px;
      background: rgba(67,39,99,.92); color: #f8efff; font: 700 12px var(--ui);
      cursor: pointer; touch-action: manipulation; }
    [data-combat-challenge]:hover:not(:disabled) { border-color: #d3adff; background: rgba(87,51,127,.96); }
    [data-combat-challenge]:disabled, [data-combat-champion]:disabled {
      cursor: not-allowed; color: #8394ab; border-color: #39495f;
      background: rgba(18,26,39,.72); opacity: .82; }
    .combat-card-status { min-height: 20px; color: #dce9fa; }
    .combat-card-status[data-convergence="read-only-reload"] { color: #f0bd92; }
    #combatpanel { width: min(520px, calc(100vw - var(--safe-left) - var(--safe-right) - 16px)); }
    #combatpanel [data-combat-chronicle-body] { display: grid; gap: 8px; min-width: 0; }
    #combatpanel [data-combat-hp-side] { display: grid;
      grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: center;
      padding: 8px 10px; border: 1px solid rgba(94,120,163,.55); border-radius: 10px;
      background: rgba(7,13,25,.78); }
    #combatpanel [data-combat-hp-name] { min-width: 0; overflow: hidden;
      color: #eef5ff; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    #combatpanel [data-combat-hp-current] { color: #c9d8eb;
      font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #combatpanel [data-combat-hp-progress] { grid-column: 1 / -1; width: 100%; height: 11px;
      accent-color: #7fe6a0; }
    #combatpanel [data-combat-hp-side="B"] [data-combat-hp-progress] { accent-color: #d3adff; }
    #combatpanel [data-combat-chronicle-log] { display: grid; gap: 5px;
      max-height: min(44dvh, 430px); overflow: auto; overscroll-behavior: contain;
      padding: 9px; border: 1px solid rgba(87,112,154,.5); border-radius: 10px;
      background: rgba(4,8,18,.84); scrollbar-gutter: stable; }
    #combatpanel [data-combat-chronicle-kind] { padding: 6px 8px;
      border-left: 3px solid #526d98; border-radius: 6px; background: rgba(24,38,62,.5);
      color: #dce9fa; line-height: 1.42; overflow-wrap: anywhere; }
    #combatpanel [data-combat-chronicle-tone="critical"] { border-color: #ffd96a; color: #fff1b0; }
    #combatpanel [data-combat-chronicle-tone="death"] { border-color: #ff7d8b; color: #ffd1d6; }
    #combatpanel [data-combat-chronicle-tone="burn"] { border-color: #ff9a63; color: #ffd6bd; }
    #combatpanel [data-combat-chronicle-tone="heal"] { border-color: #70dba0; color: #c9f6d8; }
    #combatpanel [data-combat-chronicle-tone="stun"],
    #combatpanel [data-combat-chronicle-tone="miss"] { border-color: #83c9ed; color: #cceeff; }
    #combatpanel [data-combat-chronicle-tone="statistics"] { border-color: #b58ae7; color: #e9d8ff; }
    #combatpanel [data-combat-chronicle-result] { margin: 2px 0; padding: 9px 10px;
      border: 1px solid rgba(202,162,79,.72); border-radius: 10px;
      background: rgba(65,49,20,.38); color: #ffe5a8; line-height: 1.45; }
    #combatpanel :is([data-combat-chronicle-skip],[data-combat-chronicle-share]) {
      width: 100%; min-height: 44px; box-sizing: border-box; border: 1px solid #7f65a5;
      border-radius: 10px; background: rgba(67,39,99,.82); color: #f8efff;
      padding: 8px 12px; font: 700 12px var(--ui); cursor: pointer; }
    #combatpanel :is([data-combat-chronicle-skip],[data-combat-chronicle-share]):focus-visible {
      outline: 3px solid #f3d58b; outline-offset: 2px; }
    #combatpanel [data-combat-share-fallback] { width: 100%; min-height: 132px;
      box-sizing: border-box; resize: vertical; border: 1px solid #57709a; border-radius: 10px;
      background: #07101d; color: #eef6ff; padding: 9px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (max-width: 390px) {
      .capture-card-row { grid-template-columns: minmax(0,1fr); }
      .capture-card-action { grid-column: 1; grid-row: auto; width: 100%; }
    }
    /* On a landed phone the card and living-world strip are both useful:
       stack them in portrait and split the safe rectangle in landscape.
       --planetside-top is measured from the real populated strip, so larger
       text and lazy portraits cannot silently place it behind the card. */
    @media (max-width: 900px) and (orientation: portrait) {
      body.surface-mode #survey {
        max-height: max(44px, calc(var(--planetside-top, 100dvh) - var(--topbar-h) - 14px));
      }
      /* A short portrait keeps the trail. Cap the populated strip to the live
         band between the lowest VISIBLE top-chrome edge and the already-
         measured lower chrome; only the strip scrolls when A++ cannot fit.
         While Survey stays open after Land, its 44px minimum plus the
         existing 8px stack gap also caps this bottom-anchored strip. The
         shared bottom-anchor terms cancel, so unusual dock/context heights
         cannot recreate the compact-phone overlap. */
      body.surface-mode #planetside {
        max-height: max(72px, min(
          calc(100dvh - var(--safe-bottom) - var(--dock-h) - var(--ctx-h) - 92px - var(--surface-chrome-bottom)),
          var(--planetside-card-max, 100dvh)));
        overflow-y: auto !important;
      }
      body.surface-mode.card-open #planetside {
        --planetside-card-max: calc(100dvh - var(--safe-bottom) - var(--dock-h) - var(--ctx-h) - var(--topbar-h) - 144px);
      }
      /* If a genuinely short portrait cannot retain a useful 72px roster
         viewport plus 6px clearance, the noninteractive trail yields. */
      body.surface-mode.surface-trail-yield #trail { display: none; }
    }
    @media (max-width: 900px) and (orientation: landscape) {
      /* The short landscape safe rectangle cannot fit the populated world
         strip plus separate trail/objective rows at 44px/A++. Planetside is
         the actionable reading, so those secondary rows yield while landed
         and return on ascent. */
      body.surface-mode :is(#trail,#objchip) { display: none; }
      .capture-card-action { align-self: center; }

      :is(button, input, textarea, [tabindex]):focus-visible { outline-color: Highlight; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header id="topbar" data-panel-boundary>
    <span id="playerchip" class="glass pill"></span>
    <div id="hpbar" class="glass pill"><span>❤</span><span class="track"><span class="fill" style="width:100%"></span><span class="txt"></span></span></div>
  </header>
  <button id="primechip" class="glass pill" type="button" aria-label="Open Prime Codex"></button>
  <input id="searchbox" class="glass pill" type="search" autocomplete="off" spellcheck="false"
    placeholder="Search or paste code" aria-label="search or paste a code" />
  <div id="trail"></div>
  <span id="objchip" class="glass pill"></span>
  <div id="ctxbar"></div>
  <div id="hintpill" class="glass pill"></div>
  <nav id="raillft" aria-label="rail" data-panel-boundary>
    <button id="railcharters" aria-label="Charters">📕 Charters</button>
    <button id="railcodex" aria-label="Compendium">📘 Compendium</button>
  </nav>
  <nav id="railrgt" aria-label="right rail" data-panel-boundary>
    <button id="railatlas" aria-label="Star Atlas">🌐 Star Atlas</button>
    <button id="railshipyard" aria-label="Shipyard">🛠 Shipyard</button>
    <button id="railinventory" aria-label="Inventory" aria-controls="inventorypanel" aria-expanded="false">🎒 Inventory</button>
    <button id="railrecords" aria-label="Records">📜 Records</button>
  </nav>
  <nav id="dock" aria-label="dock" data-panel-boundary>
    <button id="docksurvey" aria-label="survey card" aria-controls="survey" aria-expanded="false"><span class="ico">🔭</span>survey</button>
    <button id="dockcodex" aria-label="Compendium"><span class="ico">📘</span>codex</button>
    <button id="dockrecords" aria-label="Records"><span class="ico">📜</span>records</button>
    <button id="dockcharters" aria-label="Charters"><span class="ico">📕</span>charters</button>
    <button id="dockatlas" aria-label="Star Atlas"><span class="ico">🌐</span>atlas</button>
    <button id="dockcharts" aria-label="star charts" aria-pressed="false"><span class="ico">📈</span>charts</button>
    <button id="dockshipyard" aria-label="Shipyard"><span class="ico">🛠</span>shipyard</button>
    <button id="dockinventory" aria-label="Inventory" aria-controls="inventorypanel" aria-expanded="false"><span class="ico">🎒</span>inventory</button>
    <button id="docksets" aria-label="settings"><span class="ico">⚙</span>settings</button>
    <button id="dockguide" aria-label="Guide"><span class="ico">?</span>guide</button>
  </nav>
  <aside id="setpanel" class="glass panel" aria-label="Settings"></aside>
  <aside id="guidepanel" class="glass panel" aria-label="Guide"></aside>
  <aside id="codexpanel" class="glass panel" aria-label="Compendium"></aside>
  <aside id="recpanel" class="glass panel" aria-label="Records"></aside>
  <aside id="atlaspanel" class="glass panel" aria-label="Star Atlas"></aside>
  <aside id="chpanel" class="glass panel" aria-label="Charters"></aside>
  <aside id="primepanel" class="glass panel" aria-label="Prime Codex"></aside>
  <aside id="combatpanel" class="glass panel" aria-label="Combat Chronicle">
    <h3>Combat Chronicle</h3>
    <div data-combat-chronicle-body></div>
  </aside>
  <aside id="shipyardpanel" class="glass panel" aria-label="Shipyard">
    <div class="engineering-panel-body" data-engineering-panel-body></div>
  </aside>
  <aside id="inventorypanel" class="glass panel" aria-label="Inventory" aria-hidden="true" style="display:none">
    <div class="inventory-panel-body" data-inventory-panel-body></div>
  </aside>
  <div id="inventorysheet" role="dialog" aria-modal="true" aria-labelledby="inventorysheettitle"
    aria-hidden="true" data-panel-boundary hidden>
    <section class="inventory-sheet-card">
      <button type="button" class="surface-close inventory-sheet-close" data-inventory-sheet-close
        aria-label="Close item inspection">✕</button>
      <h2 id="inventorysheettitle">Item inspection</h2>
      <div data-inventory-sheet-body></div>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
