<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Celestial Frontier v2 — Phase 4 shell</title>
  <style>
    /* THE GLASS SYSTEM — POSITION PARITY WITH THE GOLDEN SCREENS
       (port/baseline-v1.8.9/screens/ui-main-*.png): the top is FLOATING
       PILLS on the canvas, not a solid bar — player chip top-left with the
       HP bar under it, Prime Codex pill top-center, trail beneath it,
       objective chip left at ~26vh, caption + hint stacked bottom-center.
       ≤900px: the round-button DOCK bottom-center (the phone golden).
       >900px: Compendium rides the LEFT RAIL and the round cluster sits
       BOTTOM-RIGHT (the desktop golden; the dock lesson of ROADMAP #11 —
       above 900px these are rail surfaces, not a dock). */
    :root { --glass-a: 0.72; --topbar-h: 96px; }
    html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden;
      font: 13px/1.5 system-ui, sans-serif; color: #cfe0f4;
      -webkit-user-select: none; user-select: none; }
    .glass { background: rgba(10, 16, 30, var(--glass-a)); border: 1px solid #22304a;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .pill { border-radius: 999px; }

    /* ---- top-left: the explorer chip + the HP bar (golden position) ---- */
    #topbar { position: fixed; top: 0; left: 0; z-index: 20; pointer-events: none;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 0 0 12px; background: none; border: 0; }
    #playerchip { display: inline-block; padding: 6px 16px; font-size: 11.5px;
      letter-spacing: 0.08em; text-transform: uppercase; color: #dbe7f8; font-weight: 600; }
    #playerchip .dim { color: #8fa3c4; }
    #hpbar { display: flex; align-items: center; gap: 6px; margin-top: 6px;
      padding: 3px 10px 3px 6px; width: max-content; }
    #hpbar .track { display: block; width: 128px; height: 12px; border-radius: 999px;
      background: #16202f; overflow: hidden; border: 1px solid #22304a; }
    #hpbar .fill { display: block; height: 100%; background: linear-gradient(180deg, #7fe08a, #3fae52);
      border-radius: 999px; }
    #hpbar .txt { font-size: 10.5px; color: #cfe0f4; }

    /* ---- top-center: the Prime Codex pill + the trail beneath ---- */
    #primechip { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: none;
      padding: 5px 16px; font-size: 12px; font-weight: 600; color: #ffd9a0;
      border-color: #6e5a30; }
    #trail { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 48px);
      left: 50%; transform: translateX(-50%); z-index: 19; pointer-events: none;
      font-size: 11px; letter-spacing: 0.06em; color: #8fa3c4; white-space: nowrap;
      max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
    #trail .cur { color: #aee0ff; }
    #trail .sep { color: #5a6f95; padding: 0 5px; font-size: 9px; }

    /* ---- top-right: the search bar (both goldens' slot) ---- */
    #searchbox { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: 12px; z-index: 21; width: min(300px, 40vw); box-sizing: border-box;
      padding: 8px 16px; font: 12.5px system-ui, sans-serif; color: #cfe0f4;
      outline: none; }
    #searchbox::placeholder { color: #6d84a8; }

    /* the PHONE golden: Prime rides the dock tier there, not the top — and
       the player chip yields room to the search bar */
    @media (max-width: 900px) {
      #primechip { display: none; }
      #trail { top: calc(env(safe-area-inset-top, 0px) + 96px); }
      #playerchip { box-sizing: border-box; max-width: calc(58vw - 32px);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
      #searchbox { width: 42vw; }
    }

    /* ---- the objective chip: LEFT, ~26vh (both goldens) ---- */
    #objchip { position: fixed; left: 12px; top: 26vh; z-index: 18;
      padding: 6px 14px; font-size: 12px; color: #ffd9a0; max-width: min(340px, 80vw); }
    #objchip:empty { display: none; }
    #objchip .prog { color: #7ec8f0; font-weight: 600; }

    /* ---- the survey card: below the chip stack, clear of the bottom chrome ---- */
    #survey { position: fixed; top: var(--topbar-h); right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 128px);
      width: min(340px, 86vw); overflow: auto; z-index: 15;
      color: #cfe0f4; padding: 14px; box-sizing: border-box; display: none;
      border-width: 0 0 0 1px; border-radius: 0; }

    /* ---- bottom-center: caption ABOVE the hint pill (golden order) ---- */
    #ctxbar { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
      max-width: min(560px, 88vw); text-align: center; pointer-events: none; z-index: 12;
      font-size: 12.5px; color: #9fb6d6; text-shadow: 0 1px 3px #000; }
    #hintpill { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 88px); z-index: 12; pointer-events: none;
      font-size: 11.5px; color: #7f96ba; padding: 4px 14px; white-space: nowrap;
      max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }

    /* ---- the dock: ROUND icon buttons (phone golden), bottom-center ---- */
    #dock { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 20;
      display: flex; gap: 10px; background: none; border: 0;
      flex-wrap: wrap; justify-content: center; max-width: 330px; }   /* 7 buttons wrap into the phone golden's two tiers */
    #dock button { width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid #2a3c5e; background: rgba(14, 22, 40, 0.88); color: #9fb6d6;
      cursor: pointer; font: 9px system-ui, sans-serif; padding: 0; }
    #dock button .ico { display: block; font-size: 17px; line-height: 1.1; margin-top: 4px; }
    #dock button.on { background: #1d3a5e; color: #eaf2ff; border-color: #caa24f; }

    /* ---- >900px: the desktop golden — Compendium on the LEFT RAIL, the
       round cluster BOTTOM-RIGHT (rails, not a dock; ROADMAP #11) ---- */
    #raillft { position: fixed; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 108px);
      z-index: 20; display: none; flex-direction: column; gap: 8px; }
    #raillft button { display: flex; align-items: center; gap: 8px; min-height: 44px;
      padding: 6px 16px; border-radius: 999px; border: 1px solid #2a3c5e;
      background: rgba(14, 22, 40, 0.88); color: #cfe0f4; cursor: pointer;
      font: 12px system-ui, sans-serif; }
    #raillft button.on { background: #1d3a5e; border-color: #caa24f; }
    #railrgt { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 108px);
      z-index: 20; display: none; flex-direction: column; gap: 8px; align-items: flex-end; }
    #railrgt button { display: flex; align-items: center; gap: 8px; min-height: 44px;
      padding: 6px 16px; border-radius: 999px; border: 1px solid #2a3c5e;
      background: rgba(14, 22, 40, 0.88); color: #cfe0f4; cursor: pointer;
      font: 12px system-ui, sans-serif; }
    #railrgt button.on { background: #1d3a5e; border-color: #caa24f; }
    @media (min-width: 901px) {
      #dock { left: auto; right: 14px; transform: none; }
      #dock #dockcodex, #dock #dockrecords, #dock #dockatlas { display: none; }   /* rails own them on desktop */
      #raillft, #railrgt { display: flex; }
    }

    /* ---- rail panels (the one-panel law lives in panels.ts) ---- */
    .panel { position: fixed; top: calc(var(--topbar-h) + 6px); left: 8px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
      width: min(360px, 92vw); overflow: auto; z-index: 22;   /* over chips + rails; the dock stays clear below */
      border-radius: 12px; padding: 10px 14px 14px; box-sizing: border-box; }
    .panel h3 { margin: 2px 0 10px; font-size: 15px; color: #f4f8ff; }
    .panel .row { display: flex; align-items: center; gap: 10px; margin: 8px 0;
      min-height: 44px; }
    .panel .row label { flex: 1; color: #9fb6d6; }
    .panel .row input[type=range] { flex: 1.4; accent-color: #7ec8f0; }
    .panel .seg { display: flex; gap: 4px; }
    .panel .seg button, .panel .row > button { min-height: 38px; min-width: 44px;
      border: 1px solid #2a3c5e; border-radius: 9px; background: rgba(14,22,40,0.85);
      color: #9fb6d6; cursor: pointer; padding: 4px 10px; font: 12px system-ui, sans-serif; }
    .panel .seg button.on, .panel .row > button.on { background: #1d3a5e; color: #eaf2ff; border-color: #3a5c8e; }
    .panel .centry { padding: 6px 0; border-bottom: 1px solid rgba(34,48,74,0.6); }
    .panel .centry b { color: #eaf2ff; }
    .panel .centry .sub { color: #8fa3c4; font-size: 12px; }
    .panel .empty { color: #7f96ba; font-style: italic; padding: 12px 0; }
  </style>
</head>
<body>
  <header id="topbar">
    <span id="playerchip" class="glass pill"></span>
    <div id="hpbar" class="glass pill"><span>❤</span><span class="track"><span class="fill" style="width:100%"></span></span><span class="txt"></span></div>
  </header>
  <span id="primechip" class="glass pill"></span>
  <input id="searchbox" class="glass pill" type="search" autocomplete="off" spellcheck="false"
    placeholder="Search discoveries or paste code" aria-label="search or paste a code" />
  <div id="trail"></div>
  <span id="objchip" class="glass pill"></span>
  <div id="ctxbar"></div>
  <div id="hintpill" class="glass pill"></div>
  <nav id="raillft" aria-label="rail">
    <button id="railcodex" aria-label="Compendium">📘 Compendium</button>
  </nav>
  <nav id="railrgt" aria-label="right rail">
    <button id="railatlas" aria-label="Star Atlas">🌐 Star Atlas</button>
    <button id="railrecords" aria-label="Records">📜 Records</button>
  </nav>
  <nav id="dock" aria-label="dock">
    <button id="docksurvey" aria-label="survey card"><span class="ico">🔭</span>survey</button>
    <button id="dockcodex" aria-label="Compendium"><span class="ico">📘</span>codex</button>
    <button id="dockrecords" aria-label="Records"><span class="ico">📜</span>records</button>
    <button id="dockatlas" aria-label="Star Atlas"><span class="ico">🌐</span>atlas</button>
    <button id="dockcharts" aria-label="star charts"><span class="ico">📈</span>charts</button>
    <button id="docksets" aria-label="settings"><span class="ico">⚙</span>settings</button>
    <button id="docksave" aria-label="save import"><span class="ico">📥</span>save</button>
  </nav>
  <aside id="setpanel" class="glass panel" aria-label="Settings"></aside>
  <aside id="codexpanel" class="glass panel" aria-label="Compendium"></aside>
  <aside id="recpanel" class="glass panel" aria-label="Records"></aside>
  <aside id="atlaspanel" class="glass panel" aria-label="Star Atlas"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
